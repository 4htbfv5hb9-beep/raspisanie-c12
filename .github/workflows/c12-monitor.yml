name: Telegram bot and С-12 replacement monitor

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c12-telegram-monitor
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process Telegram updates and check replacements
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python actions_runner.py

      - name: Save encrypted bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/state.enc
          if ! git diff --cached --quiet; then
            git commit -m "Update encrypted Telegram bot state"
            git push
          fi
